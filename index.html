<body class="bg-neutral-50 text-neutral-900 min-h-screen pb-20 md:pb-12 antialiased selection:bg-neutral-900 selection:text-white">

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, deleteUser } 
        from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, addDoc, deleteDoc, query, where } 
        from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcrBKhvoe17gvdwjAUgXelmHEUWol-_bo",
            authDomain: "websquare-5cf10.firebaseapp.com",
            projectId: "websquare-5cf10",
            storageBucket: "websquare-5cf10.firebasestorage.app",
            messagingSenderId: "644737065700",
            appId: "1:644737065700:web:f54489c873299eee5402f1",
            measurementId: "G-SB7B0C7FHF"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        window.FB_MODULE = {
            app, db, auth,
            GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, deleteUser,
            doc, getDoc, setDoc, updateDoc, collection, onSnapshot, addDoc, deleteDoc, query, where

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 초고율 이미지 압축 헬퍼
        const processImageFile = (file, maxDimension = 600, quality = 0.6) => {
            return new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) {
                    reject(new Error("올바른 이미지 파일이 아닙니다."));
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = () => reject(new Error("이미지 로드 실패"));
                    img.src = event.target.result;
                };
                reader.onerror = () => reject(new Error("파일 읽기 실패"));
                reader.readAsDataURL(file);
            });
        };

        const CATEGORIES = ['전체', '생산성', '공부', '디자인', '개발', '게임', '음악', '금융', '생활', 'AI', '기타'];

        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className="fixed bottom-6 right-6 z-50 bg-neutral-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2.5 transition-all animate-bounce">
                    <i className={`fas ${type === 'error' ? 'fa-circle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400'}`}></i>
                    <span>{message}</span>
                </div>
            );
        }

        function App() {
            const [apps, setApps] = useState([]);
            const [approvedAppsList, setApprovedAppsList] = useState([]);
            const [myAppsList, setMyAppsList] = useState([]);
            const [pendingAppsList, setPendingAppsList] = useState([]);

            const [selectedCategory, setSelectedCategory] = useState('전체');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTab, setActiveTab] = useState('home'); // 'home' | 'my_apps' | 'admin'
            const [selectedApp, setSelectedApp] = useState(null);
            const [isRegisterOpen, setIsRegisterOpen] = useState(false);
            
            const [rejectionModalApp, setRejectionModalApp] = useState(null);
            const [rejectionReason, setRejectionReason] = useState('');
            const [toast, setToast] = useState(null);

            const [deleteAppTarget, setDeleteAppTarget] = useState(null);
            const [adminSubTab, setAdminSubTab] = useState('pending'); // 'pending' | 'all'

            // 계정 관련 모달 및 메뉴 상태
            const [isAccountMenuOpen, setIsAccountMenuOpen] = useState(false);
            const [isAccountInfoOpen, setIsAccountInfoOpen] = useState(false);
            const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
            const accountMenuRef = useRef(null);

            // 로그인 사용자 상태 정보
            const [currentUser, setCurrentUser] = useState({
                uid: null,
                role: 'user',
                name: '',
                email: '',
                photoURL: ''
            });

            // 업로드 관리
            const [uploadedIcon, setUploadedIcon] = useState(null);
            const [uploadedScreenshots, setUploadedScreenshots] = useState([]);
            const [isUploading, setIsUploading] = useState(false);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            // 계정 메뉴 외부 클릭 감지하여 닫기
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (accountMenuRef.current && !accountMenuRef.current.contains(event.target)) {
                        setIsAccountMenuOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            // Google 로그인 핸들러
            const handleGoogleLogin = async () => {
                if (window.FB_MODULE && window.FB_MODULE.auth) {
                    const { auth, GoogleAuthProvider, signInWithPopup } = window.FB_MODULE;
                    const provider = new GoogleAuthProvider();
                    try {
                        await signInWithPopup(auth, provider);
                        showToast("성공적으로 로그인되었습니다.");
                    } catch (error) {
                        console.error("Google 로그인 실패:", error);
                        showToast("로그인에 실패했습니다. 다시 시도해주세요.", "error");
                    }
                }
            };

            // 로그아웃 핸들러
            const handleLogout = async () => {
                setIsAccountMenuOpen(false);
                if (window.FB_MODULE && window.FB_MODULE.auth) {
                    const { auth, signOut } = window.FB_MODULE;
                    try {
                        await signOut(auth);
                        setCurrentUser({ uid: null, role: 'user', name: '', email: '', photoURL: '' });
                        if (activeTab === 'my_apps' || activeTab === 'admin') {
                            setActiveTab('home');
                        }
                        showToast("로그아웃 되었습니다.");
                    } catch (error) {
                        console.error("로그아웃 실패:", error);
                        showToast("로그아웃 실패: 네트워크 상태를 확인하세요.", "error");
                    }
                }
            };

            // 계정 삭제 핸들러
            const handleDeleteAccount = async () => {
                if (!currentUser.uid) return;
                setIsDeleteModalOpen(false);
                setIsAccountMenuOpen(false);

                if (window.FB_MODULE && window.FB_MODULE.auth && window.FB_MODULE.db) {
                    const { auth, db, deleteUser, doc, deleteDoc } = window.FB_MODULE;
                    const firebaseUser = auth.currentUser;

                    try {
                        // 1. Firestore users/{uid} 문서 삭제
                        const userRef = doc(db, "users", currentUser.uid);
                        await deleteDoc(userRef);

                        // 2. Firebase Auth 사용자 계정 삭제 (apps 문서는 유지됨)
                        if (firebaseUser) {
                            await deleteUser(firebaseUser);
                        }

                        setCurrentUser({ uid: null, role: 'user', name: '', email: '', photoURL: '' });
                        if (activeTab === 'my_apps' || activeTab === 'admin') {
                            setActiveTab('home');
                        }
                        showToast("계정이 안전하게 삭제되었습니다.");
                    } catch (error) {
                        console.error("계정 삭제 에러:", error);
                        if (error.code === 'auth/requires-recent-login') {
                            showToast("보안을 위해 다시 로그인한 뒤 계정 삭제를 시도해주세요.", "error");
                        } else {
                            showToast("계정 삭제 중 오류가 발생했습니다.", "error");
                        }
                    }
                }
            };

            // 1. 인증 상태 변경 감지 및 users/{uid} 사용자 정보 처리
            useEffect(() => {
                if (window.FB_MODULE && window.FB_MODULE.auth) {
                    const { auth, db, onAuthStateChanged, doc, getDoc, setDoc } = window.FB_MODULE;

                    const unsubscribeAuth = onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            const userRef = doc(db, "users", user.uid);
                            let userRole = "user";
                            let userData = null;

                            try {
                                const userSnap = await getDoc(userRef);
                                if (userSnap.exists()) {
                                    userData = userSnap.data();
                                    userRole = userData.role || "user";
                                } else {
                                    // 신규 사용자 문서 자동 생성 (users/{uid})
                                    const newUserDoc = {
                                        uid: user.uid,
                                        role: "user",
                                        name: user.displayName || "사용자",
                                        email: user.email || "",
                                        photoURL: user.photoURL || "",
                                        createdAt: new Date().toISOString()
                                    };
                                    await setDoc(userRef, newUserDoc);
                                    userData = newUserDoc;
                                    console.log("Firestore users/{uid} 문서를 성공적으로 생성하였습니다:", user.uid);
                                }
                            } catch (error) {
                                console.error("users/{uid} 문서 조회/생성 중 오류 발생:", error);
                            }

                            setCurrentUser({
                                uid: user.uid,
                                role: userRole,
                                name: (userData && userData.name) || user.displayName || "사용자",
                                email: (userData && userData.email) || user.email || "",
                                photoURL: (userData && userData.photoURL) || user.photoURL || ""
                            });
                        } else {
                            setCurrentUser({ uid: null, role: 'user', name: '', email: '', photoURL: '' });
                        }
                    });

                    return () => unsubscribeAuth();
                }
            }, []);

            // 2. Security Rules에 정렬된 조건별 Firestore 앱 쿼리 구독
            useEffect(() => {
                if (!window.FB_MODULE || !window.FB_MODULE.db) {
                    setApps([]);
                    return;
                }

                const { db, collection, query, where, onSnapshot } = window.FB_MODULE;
                const unsubs = [];

                // (1) 승인된 앱 (status == "approved") - 누구나 읽기 가능
                try {
                    const approvedQuery = query(collection(db, 'apps'), where("status", "==", "approved"));
                    const unsubApproved = onSnapshot(approvedQuery, (snapshot) => {
                        const fetched = [];
                        snapshot.forEach((docSnap) => {
                            fetched.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setApprovedAppsList(fetched);
                    }, (error) => {
                        console.error("Approved apps 조회 에러:", error);
                    });
                    unsubs.push(unsubApproved);
                } catch (err) {
                    console.error("Approved apps query 설정 실패:", err);
                }

                // (2) 내 앱 (developerId == currentUser.uid) - 로그인 상태에서만 실행
                if (currentUser.uid) {
                    try {
                        const myAppsQuery = query(collection(db, 'apps'), where("developerId", "==", currentUser.uid));
                        const unsubMyApps = onSnapshot(myAppsQuery, (snapshot) => {
                            const fetched = [];
                            snapshot.forEach((docSnap) => {
                                fetched.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            setMyAppsList(fetched);
                        }, (error) => {
                            console.error("My apps 조회 에러:", error);
                        });
                        unsubs.push(unsubMyApps);
                    } catch (err) {
                        console.error("My apps query 설정 실패:", err);
                    }
                } else {
                    setMyAppsList([]);
                }

                // (3) 관리자용 심사 대기 앱 (status == "pending") - admin 권한 확인 시에만 실행
                if (currentUser.role === 'admin') {
                    try {
                        const pendingQuery = query(collection(db, 'apps'), where("status", "==", "pending"));
                        const unsubPending = onSnapshot(pendingQuery, (snapshot) => {
                            const fetched = [];
                            snapshot.forEach((docSnap) => {
                                fetched.push({ id: docSnap.id, ...docSnap.data() });
                            });
                            setPendingAppsList(fetched);
                        }, (error) => {
                            console.error("Pending apps 조회 에러:", error);
                        });
                        unsubs.push(unsubPending);
                    } catch (err) {
                        console.error("Pending apps query 설정 실패:", err);
                    }
                } else {
                    setPendingAppsList([]);
                }

                return () => {
                    unsubs.forEach((unsub) => unsub && unsub());
                };
            }, [currentUser.uid, currentUser.role]);

            // 3. 개별 쿼리 결과를 고유 id 기준 Map으로 중복 제거 및 단일 apps 상태로 병합
            useEffect(() => {
                const combinedAppsMap = new Map();

                approvedAppsList.forEach((item) => combinedAppsMap.set(item.id, item));
                myAppsList.forEach((item) => combinedAppsMap.set(item.id, item));
                pendingAppsList.forEach((item) => combinedAppsMap.set(item.id, item));

                const mergedList = Array.from(combinedAppsMap.values());
                setApps(mergedList);
            }, [approvedAppsList, myAppsList, pendingAppsList]);

            // 아이콘 업로드
            const handleIconFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    setIsUploading(true);
                    const resizedDataUrl = await processImageFile(file, 180, 0.65);
                    setUploadedIcon(resizedDataUrl);
                    showToast("아이콘이 압축 업로드되었습니다.");
                } catch (err) {
                    showToast(err.message || "아이콘 업로드 실패", "error");
                } finally {
                    setIsUploading(false);
                }
            };

            // 스크린샷 업로드
            const handleScreenshotsFileChange = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (uploadedScreenshots.length + files.length > 3) {
                    showToast("스크린샷은 최대 3장까지만 등록 가능합니다.", "error");
                    return;
                }

                try {
                    setIsUploading(true);
                    const processedList = await Promise.all(
                        files.map(f => processImageFile(f, 600, 0.6))
                    );
                    setUploadedScreenshots(prev => [...prev, ...processedList]);
                    showToast(`${processedList.length}장의 스크린샷이 압축 등록되었습니다.`);
                } catch (err) {
                    showToast(err.message || "스크린샷 업로드 실패", "error");
                } finally {
                    setIsUploading(false);
                }
            };

            const removeScreenshot = (index) => {
                setUploadedScreenshots(prev => prev.filter((_, i) => i !== index));
            };

            // 웹앱 신규 등록 신청 (Firestore 저장)
            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                if (!currentUser.uid) {
                    showToast("웹앱을 등록하려면 먼저 로그인해 주세요.", "error");
                    handleGoogleLogin();
                    return;
                }

                const form = e.target;

                if (!uploadedIcon) {
                    showToast("앱 아이콘 이미지를 첨부해 주세요.", "error");
                    return;
                }

                const newAppData = {
                    name: form.name.value.trim(),
                    url: form.url.value.trim(),
                    shortDescription: form.shortDescription.value.trim(),
                    description: form.description.value.trim(),
                    category: form.category.value,
                    developer: form.developer.value.trim(),
                    iconUrl: uploadedIcon,
                    screenshots: uploadedScreenshots.length > 0 ? uploadedScreenshots : [uploadedIcon],
                    developerId: currentUser.uid,
                    status: 'pending',
                    createdAt: new Date().toISOString().split('T')[0],
                    rejectionReason: ''
                };

                if (window.FB_MODULE && window.FB_MODULE.db) {
                    try {
                        setIsUploading(true);
                        const { db, collection, addDoc } = window.FB_MODULE;
                        const appsRef = collection(db, 'apps');
                        await addDoc(appsRef, newAppData);
                        showToast("웹앱 등록 신청이 완료되었습니다. 관리자 검수 후 공개됩니다.");
                    } catch (err) {
                        console.error("Firestore 등록 에러:", err);
                        showToast("등록 실패: 네트워크 상태를 확인하세요.", "error");
                    } finally {
                        setIsUploading(false);
                    }
                } else {
                    showToast("Firebase 연결을 확인해주세요.", "error");
                }

                setIsRegisterOpen(false);
                setUploadedIcon(null);
                setUploadedScreenshots([]);
            };

            // 검수 상태 변경 (승인 / 거절)
            const handleUpdateStatus = async (targetAppId, newStatus, reason = '') => {
                if (currentUser.role !== 'admin') {
                    showToast("관리자 권한이 필요합니다.", "error");
                    return;
                }

                if (window.FB_MODULE && window.FB_MODULE.db) {
                    try {
                        const { db, doc, updateDoc } = window.FB_MODULE;
                        const appDocRef = doc(db, 'apps', targetAppId);
                        await updateDoc(appDocRef, {
                            status: newStatus,
                            rejectionReason: reason,
                            updatedAt: new Date().toISOString()
                        });
                        showToast(newStatus === 'approved' ? "웹앱이 승인되었습니다." : "신청이 거절 처리되었습니다.");
                    } catch (err) {
                        console.error("상태 업데이트 실패:", err);
                        setApps(prev => prev.map(a => a.id === targetAppId ? { ...a, status: newStatus, rejectionReason: reason } : a));
                        showToast("상태가 변경되었습니다.");
                    }
                } else {
                    setApps(prev => prev.map(a => a.id === targetAppId ? { ...a, status: newStatus, rejectionReason: reason } : a));
                    showToast("상태가 변경되었습니다.");
                }

                setRejectionModalApp(null);
                setRejectionReason('');
            };

            // 웹앱 삭제 함수 (관리자 또는 본인 등록 웹앱)
            const handleDeleteApp = async (appId) => {
                const targetApp = apps.find(a => a.id === appId);
                const isOwner = targetApp && targetApp.developerId === currentUser.uid;
                const isAdmin = currentUser.role === 'admin';

                if (!isAdmin && !isOwner) {
                    showToast("삭제 권한이 없습니다.", "error");
                    setDeleteAppTarget(null);
                    return;
                }

                if (window.FB_MODULE && window.FB_MODULE.db) {
                    try {
                        const { db, doc, deleteDoc } = window.FB_MODULE;
                        const appRef = doc(db, 'apps', appId);
                        await deleteDoc(appRef);
                        showToast("웹앱이 성공적으로 삭제되었습니다.");
                    } catch (err) {
                        console.error("앱 삭제 실패:", err);
                        showToast("삭제 실패: 권한 또는 네트워크 상태를 확인하세요.", "error");
                    }
                } else {
                    setApps(prev => prev.filter(a => a.id !== appId));
                    showToast("웹앱이 삭제되었습니다.");
                }

                setDeleteAppTarget(null);
                if (selectedApp && selectedApp.id === appId) {
                    setSelectedApp(null);
                }
            };

            // 필터링된 데이터 목록
            const approvedApps = useMemo(() => {
                return apps.filter(app => {
                    const isApproved = app.status === 'approved';
                    const matchesCat = selectedCategory === '전체' || app.category === selectedCategory;
                    const matchesSearch = app.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          app.shortDescription.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          app.category.toLowerCase().includes(searchQuery.toLowerCase());
                    return isApproved && matchesCat && matchesSearch;
                });
            }, [apps, selectedCategory, searchQuery]);

                                                    )}

                                                    <button
                                                        onClick={() => setSelectedApp(app)}
                                                        className="px-2.5 py-1 text-xs border border-neutral-200 text-neutral-600 rounded-lg hover:bg-neutral-50"
                                                    >
                                                        상세
                                                    </button>
                                                    
                                                    <button
                                                        onClick={() => setDeleteAppTarget(app)}
                                                        className="px-2.5 py-1 text-xs border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-50 flex items-center space-x-1"
                                                    >
                                                        <i className="fas fa-trash-alt text-[10px]"></i>
                                                        <span>삭제</span>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )
                            )}
                        </main>
                    )}

                    {/* 내 계정 정보 모달 */}
                    {isAccountInfoOpen && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative border border-neutral-100 space-y-4">
                                <button
                                    onClick={() => setIsAccountInfoOpen(false)}
                                    className="absolute top-4 right-4 w-7 h-7 bg-neutral-100 hover:bg-neutral-200 text-neutral-500 rounded-full flex items-center justify-center"
                                >
                                    <i className="fas fa-times text-xs"></i>
                                </button>

                                <div className="text-center space-y-2">
                                    {currentUser.photoURL ? (
                                        <img src={currentUser.photoURL} className="w-16 h-16 rounded-full mx-auto object-cover border border-neutral-200" />
                                    ) : (
                                        <i className="fas fa-user-circle text-5xl text-neutral-400"></i>
                                    )}
                                    <h3 className="font-bold text-base text-neutral-900">{currentUser.name || '사용자'}</h3>
                                    <p className="text-xs text-neutral-500">{currentUser.email}</p>
                                </div>

                                <div className="bg-neutral-50 p-3 rounded-xl border border-neutral-100 space-y-1 text-xs">
                                    <div className="flex justify-between">
                                        <span className="text-neutral-400">UID:</span>
                                        <span className="font-mono text-[10px] text-neutral-700 font-semibold">{currentUser.uid}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-neutral-400">권한 (Role):</span>
                                        <span className="font-semibold text-neutral-800 uppercase">{currentUser.role}</span>
                                    </div>
                                </div>

                                <button
                                    onClick={() => setIsAccountInfoOpen(false)}
                                    className="w-full py-2 bg-neutral-900 text-white rounded-xl text-xs font-semibold hover:bg-neutral-800"
                                >
                                    닫기
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 계정 삭제 확인 모달 */}
                    {isDeleteModalOpen && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl border border-neutral-100 space-y-3">
                                <div className="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-base">
                                    <i className="fas fa-exclamation-triangle"></i>
                                </div>

                                <div className="text-center space-y-1">
                                    <h3 className="text-sm font-bold text-neutral-900">정말 계정을 삭제하시겠습니까?</h3>
                                    <p className="text-xs text-neutral-500">
                                        계정을 삭제하면 프로필 및 Firestore 저장 정보가 즉시 제거되며 이 작업은 되돌릴 수 없습니다.
                                    </p>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2">
                                    <button
                                        onClick={() => setIsDeleteModalOpen(false)}
                                        className="w-1/2 py-2 border border-neutral-200 text-neutral-600 text-xs rounded-xl font-medium"
                                    >
                                        취소
                                    </button>
                                    <button
                                        onClick={handleDeleteAccount}
                                        className="w-1/2 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl transition-colors"
                                    >
                                        삭제 확정
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 앱 상세 모달 */}
                    {selectedApp && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative border border-neutral-100 space-y-4 max-h-[90vh] overflow-y-auto">
                                <button
                                    onClick={() => setSelectedApp(null)}
                                    className="absolute top-4 right-4 w-7 h-7 bg-neutral-100 hover:bg-neutral-200 text-neutral-500 rounded-full flex items-center justify-center"
                                >
                                    <i className="fas fa-times text-xs"></i>
                                </button>

                                <div className="flex items-start space-x-3.5">
                                    <img
                                        src={selectedApp.iconUrl}
                                        alt={selectedApp.name}
                                        className="w-14 h-14 rounded-2xl object-cover border border-neutral-100"
                                    />
                                    <div>
                                        <span className="text-[10px] text-neutral-400 bg-neutral-100 px-1.5 py-0.5 rounded">
                                            {selectedApp.category}
                                        </span>
                                        <h2 className="text-lg font-bold text-neutral-900 mt-1">{selectedApp.name}</h2>
                                        <p className="text-xs text-neutral-400">개발자: {selectedApp.developer}</p>
                                    </div>
                                </div>

                                {selectedApp.screenshots && selectedApp.screenshots.length > 0 && (
                                    <div className="space-y-1.5">
                                        <p className="text-xs font-semibold text-neutral-700">스크린샷 미리보기</p>
                                        <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                                            {selectedApp.screenshots.map((s, idx) => (
                                                <img
                                                    key={idx}
                                                    src={s}
                                                    className="h-44 object-cover rounded-xl border border-neutral-200 flex-shrink-0"
                                                />
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-2 text-xs">
                                    <p className="font-semibold text-neutral-900">앱 설명</p>
                                    <p className="text-neutral-600 whitespace-pre-line leading-relaxed">
                                        {selectedApp.description || selectedApp.shortDescription}
                                    </p>
                                </div>

                                <div className="pt-2 flex items-center space-x-2">
                                    {/* 관리자 또는 등록 본인일 경우 모달에서도 삭제 버튼 표시 */}
                                    {(currentUser.role === 'admin' || (currentUser.uid && selectedApp.developerId === currentUser.uid)) && (
                                        <button
                                            onClick={() => setDeleteAppTarget(selectedApp)}
                                            className="w-1/3 py-2.5 border border-rose-200 hover:bg-rose-50 text-rose-600 font-semibold rounded-xl text-xs flex items-center justify-center space-x-1.5 transition-colors"
                                        >
                                            <i className="fas fa-trash-alt text-[10px]"></i>
                                            <span>삭제</span>
                                        </button>
                                    )}
                                    <a
                                        href={selectedApp.url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className={`${(currentUser.role === 'admin' || (currentUser.uid && selectedApp.developerId === currentUser.uid)) ? 'w-2/3' : 'w-full'} py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-xl text-xs flex items-center justify-center space-x-1.5 transition-colors`}
                                    >
                                        <span>웹앱 바로가기</span>
                                        <i className="fas fa-arrow-up-right-from-square text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 웹앱 등록 신청 모달 */}
                    {isRegisterOpen && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative my-8 border border-neutral-100">
                                <button
                                    onClick={() => {
                                        setIsRegisterOpen(false);
                                        setUploadedIcon(null);
                                        setUploadedScreenshots([]);
                                    }}
                                    className="absolute top-4 right-4 w-7 h-7 bg-neutral-100 hover:bg-neutral-200 text-neutral-500 rounded-full flex items-center justify-center"
                                >
                                    <i className="fas fa-times text-xs"></i>
                                </button>

                                <div className="mb-4">
                                    <h2 className="text-base font-bold text-neutral-900">웹앱 등록 신청</h2>
                                    <p className="text-xs text-neutral-400 mt-0.5">이미지는 초고율 압축 처리되어 Firestore에 안전하게 보관됩니다.</p>
                                </div>

                                <form onSubmit={handleRegisterSubmit} className="space-y-3.5 text-xs">
                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">웹앱 이름 *</label>
                                        <input required name="name" type="text" placeholder="예: 메모RE" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white focus:border-neutral-400" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">웹앱 URL *</label>
                                            <input required name="url" type="url" placeholder="https://..." className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">카테고리 *</label>
                                            <select name="category" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white">
                                                {CATEGORIES.filter(c => c !== '전체').map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">개발자 / 팀명 *</label>
                                        <input required name="developer" type="text" placeholder="예: 코드스튜디오" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white" />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">한 줄 소개 *</label>
                                        <input required name="shortDescription" type="text" placeholder="핵심 기능 요약" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white" />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">상세 설명</label>
                                        <textarea name="description" rows="2" placeholder="앱의 상세한 정보 작성..." className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white"></textarea>
                                    </div>

                                    {/* 파일 이미지 직접 선택 및 실시간 압축 */}
                                    <div className="border-t border-neutral-100 pt-3 space-y-3">
                                        <p className="font-bold text-neutral-900 text-xs">이미지 등록 (자동 리사이징 & 압축)</p>

                                        {/* 앱 아이콘 */}
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">앱 아이콘 * (최대 180px 압축)</label>
                                            <div className="flex items-center space-x-3">
                                                <label className="cursor-pointer bg-neutral-100 hover:bg-neutral-200 border border-neutral-200 text-neutral-700 px-3 py-1.5 rounded-xl text-xs font-semibold inline-flex items-center space-x-1.5 transition-colors">
                                                    <i className="fas fa-image"></i>
                                                    <span>아이콘 선택</span>
                                                    <input type="file" accept="image/*" onChange={handleIconFileChange} className="hidden" />
                                                </label>
                                                {uploadedIcon && (
                                                    <img src={uploadedIcon} className="w-10 h-10 rounded-xl object-cover border border-neutral-200" />
                                                )}
                                            </div>
                                        </div>

                                        {/* 스크린샷 선택 */}
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">스크린샷 (최대 3장, 600px 압축)</label>
                                            <label className="cursor-pointer bg-neutral-100 hover:bg-neutral-200 border border-neutral-200 text-neutral-700 px-3 py-1.5 rounded-xl text-xs font-semibold inline-flex items-center space-x-1.5 transition-colors">
                                                <i className="fas fa-images"></i>
                                                <span>갤러리에서 추가</span>
                                                <input type="file" accept="image/*" multiple onChange={handleScreenshotsFileChange} className="hidden" />
                                            </label>

                                            {uploadedScreenshots.length > 0 && (
                                                <div className="flex space-x-2 overflow-x-auto no-scrollbar mt-2 py-1">
                                                    {uploadedScreenshots.map((src, i) => (
                                                        <div key={i} className="relative group flex-shrink-0">
                                                            <img src={src} className="h-20 w-16 object-cover rounded-lg border border-neutral-200" />
                                                            <button
                                                                type="button"
                                                                onClick={() => removeScreenshot(i)}
                                                                className="absolute top-1 right-1 bg-neutral-900/80 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]"
                                                            >
                                                                <i className="fas fa-times"></i>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setIsRegisterOpen(false);
                                                setUploadedIcon(null);
                                                setUploadedScreenshots([]);
                                            }}
                                            className="px-3 py-1.5 border border-neutral-200 text-neutral-600 rounded-xl hover:bg-neutral-50"
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={isUploading}
                                            className="px-4 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-xl"
                                        >
                                            {isUploading ? '압축 및 처리 중...' : '신청하기'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 거절 사유 작성 모달 */}
                    {rejectionModalApp && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl border border-neutral-100 space-y-3">
                                <h3 className="text-xs font-bold text-neutral-900">거절 사유 입력</h3>
                                <textarea
                                    rows="3"
                                    value={rejectionReason}
                                    onChange={(e) => setRejectionReason(e.target.value)}
                                    placeholder="거절 사유를 작성하세요..."
                                    className="w-full p-2 bg-neutral-50 border border-neutral-200 rounded-lg text-xs outline-none focus:bg-white"
                                ></textarea>

                                <div className="flex justify-end space-x-2 pt-1">
                                    <button
                                        onClick={() => setRejectionModalApp(null)}
                                        className="px-2.5 py-1 border border-neutral-200 text-neutral-600 text-xs rounded-lg"
                                    >
                                        취소
                                    </button>
                                    <button
                                        onClick={() => handleUpdateStatus(rejectionModalApp.id, 'rejected', rejectionReason || '요청 미달')}
                                        className="px-3 py-1 bg-rose-600 text-white text-xs font-semibold rounded-lg"
                                    >
                                        거절 처리
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 앱 삭제 확인 모달 (관리자 및 일반 등록자 공용) */}
                    {deleteAppTarget && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl border border-neutral-100 space-y-3">
                                <div className="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto text-base">
                                    <i className="fas fa-trash-alt"></i>
                                </div>

                                <div className="text-center space-y-1">
                                    <h3 className="text-sm font-bold text-neutral-900">웹앱 삭제 확인</h3>
                                    <p className="text-xs text-neutral-500">
                                        <strong className="text-neutral-800">{deleteAppTarget.name}</strong> 앱을 정말 삭제하시겠습니까? 삭제 후에는 복구할 수 없습니다.
                                    </p>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2">
                                    <button
                                        onClick={() => setDeleteAppTarget(null)}
                                        className="w-1/2 py-2 border border-neutral-200 text-neutral-600 text-xs rounded-xl font-medium hover:bg-neutral-50 transition-colors"
                                    >
                                        취소
                                    </button>
                                    <button
                                        onClick={() => handleDeleteApp(deleteAppTarget.id)}
                                        className="w-1/2 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl transition-colors"
                                    >
                                        삭제 확정
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
