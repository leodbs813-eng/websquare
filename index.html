    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
        from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, addDoc, deleteDoc } 
        from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDcrBKhvoe17gvdwjAUgXelmHEUWol-_bo",
            authDomain: "websquare-5cf10.firebaseapp.com",
            projectId: "websquare-5cf10",
            storageBucket: "websquare-5cf10.firebasestorage.app",
            messagingSenderId: "644737065700",
            appId: "1:644737065700:web:f54489c873299eee5402f1",
            measurementId: "G-SB7B0C7FHF"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }

        window.FB_MODULE = {
            app, db, auth,
            GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
            doc, getDoc, setDoc, updateDoc, collection, onSnapshot, addDoc, deleteDoc
        };

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 초고율 이미지 압축 헬퍼
        const processImageFile = (file, maxDimension = 600, quality = 0.6) => {
            return new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) {
                    reject(new Error("올바른 이미지 파일이 아닙니다."));
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = () => reject(new Error("이미지 로드 실패"));
                    img.src = event.target.result;
                };
                reader.onerror = () => reject(new Error("파일 읽기 실패"));
                reader.readAsDataURL(file);
            });
        };

        const INITIAL_APPS = [
            {
                id: 'init-app-1',
                name: '메모RE',
                url: 'https://memo-re.example.com',
                shortDescription: '빠르고 직관적인 오프라인 우선 노트 정리 앱',
                description: '메모RE는 오프라인 환경에서도 끊김없이 작동하는 PWA 기반 고성능 메모 서비스입니다.\n가벼운 마크다운 편집과 간편한 태그 분류 기능을 제공합니다.',
                category: '생산성',
                iconUrl: 'https://images.unsplash.com/photo-1517842645767-c639042777db?w=150&auto=format&fit=crop&q=80',
                screenshots: [
                    'https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=600&auto=format&fit=crop&q=80'
                ],
                developer: '코드스튜디오',
                developerId: 'user_dev_99',
                status: 'approved',
                createdAt: '2026-08-15'
            },
            {
                id: 'init-app-2',
                name: '픽셀 스튜디오',
                url: 'https://pixel-studio.example.com',
                shortDescription: '브라우저에서 바로 그리는 레트로 도트 그래픽 에디터',
                description: '픽셀 스튜디오는 아티스트를 위한 심플한 웹 기반 도트 아트 드로잉 툴입니다.',
                category: '디자인',
                iconUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80',
                screenshots: [
                    'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80'
                ],
                developer: '픽셀아트랩',
                developerId: 'dev_user_02',
                status: 'approved',
                createdAt: '2026-08-20'
            }
        ];

        const CATEGORIES = ['전체', '생산성', '공부', '디자인', '개발', '게임', '음악', '금융', '생활', 'AI', '기타'];

        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className="fixed bottom-6 right-6 z-50 bg-neutral-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2.5 transition-all animate-bounce">
                    <i className={`fas ${type === 'error' ? 'fa-circle-exclamation text-rose-400' : 'fa-circle-check text-emerald-400'}`}></i>
                    <span>{message}</span>
                </div>
            );
        }

        function App() {
            const [apps, setApps] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('전체');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTab, setActiveTab] = useState('home'); // 'home' | 'my_apps' | 'admin'
            const [selectedApp, setSelectedApp] = useState(null);
            const [isRegisterOpen, setIsRegisterOpen] = useState(false);
            
            const [rejectionModalApp, setRejectionModalApp] = useState(null);
            const [rejectionReason, setRejectionReason] = useState('');
            const [toast, setToast] = useState(null);

            // 로그인 사용자 상태 정보 (초기값 null/user)
            const [currentUser, setCurrentUser] = useState({
                uid: null,
                role: 'user',
                name: '',
                email: ''
            });

            // 업로드 관리
            const [uploadedIcon, setUploadedIcon] = useState(null);
            const [uploadedScreenshots, setUploadedScreenshots] = useState([]);
            const [isUploading, setIsUploading] = useState(false);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };

            // Google 로그인 핸들러
            const handleGoogleLogin = () => {
                if (window.FB_MODULE && window.FB_MODULE.auth) {
                    const { auth, GoogleAuthProvider, signInWithPopup } = window.FB_MODULE;
                    const provider = new GoogleAuthProvider();
                    signInWithPopup(auth, provider).catch(error => {
                        console.error("Google 로그인 실패:", error);
                        showToast("로그인 실패: 다시 시도해주세요.", "error");
                    });
                }
            };

            // Firebase 실시간 바인딩 및 구글 인증 상태 처리
            useEffect(() => {
                let unsubscribe = null;
                const checkAndInitFB = async () => {
                    if (window.FB_MODULE && window.FB_MODULE.db) {
                        const { db, auth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, doc, getDoc, setDoc, collection, onSnapshot } = window.FB_MODULE;

                        // Google 로그인 & Firestore 사용자 role 검증
                        onAuthStateChanged(auth, async (user) => {
                            if (user) {
                                try {
                                    const userRef = doc(db, "users", user.uid);
                                    const userSnap = await getDoc(userRef);
                                    if (userSnap.exists()) {
                                        const userData = userSnap.data();
                                        setCurrentUser({
                                            uid: user.uid,
                                            role: userData.role || "user",
                                            name: user.displayName || "사용자",
                                            email: user.email || ""
                                        });
                                    } else {
                                        // 신규 사용자 등록
                                        await setDoc(userRef, {
                                            role: "user",
                                            name: user.displayName || "",
                                            email: user.email || "",
                                            createdAt: new Date().toISOString()
                                        });
                                        setCurrentUser({
                                            uid: user.uid,
                                            role: "user",
                                            name: user.displayName || "사용자",
                                            email: user.email || ""
                                        });
                                    }
                                } catch (error) {
                                    console.error("사용자 정보 불러오기 실패:", error);
                                }
                            } else {
                                // 로그인되지 않은 상태 처리
                                setCurrentUser({ uid: null, role: 'user', name: '', email: '' });
                            }
                        });

                        // Firestore 'apps' 컬렉션 실시간 구독
                        try {
                            const appsRef = collection(db, 'apps');
                            unsubscribe = onSnapshot(appsRef, (snapshot) => {
                                const fetched = [];
                                snapshot.forEach((docSnap) => {
                                    fetched.push({ id: docSnap.id, ...docSnap.data() });
                                });

                                if (fetched.length === 0) {
                                    setApps(INITIAL_APPS);
                                } else {
                                    setApps(fetched);
                                }
                            }, (error) => {
                                console.error("Firestore 수신 에러:", error);
                                setApps(INITIAL_APPS);
                            });
                        } catch (err) {
                            console.error("Firestore 연결 모드 오류", err);
                            setApps(INITIAL_APPS);
                        }
                    } else {
                        setApps(INITIAL_APPS);
                    }
                };

                checkAndInitFB();

                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            // 아이콘 업로드
            const handleIconFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    setIsUploading(true);
                    const resizedDataUrl = await processImageFile(file, 180, 0.65);
                    setUploadedIcon(resizedDataUrl);
                    showToast("아이콘이 압축 업로드되었습니다.");
                } catch (err) {
                    showToast(err.message || "아이콘 업로드 실패", "error");
                } finally {
                    setIsUploading(false);
                }
            };

            // 스크린샷 업로드
            const handleScreenshotsFileChange = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                if (uploadedScreenshots.length + files.length > 3) {
                    showToast("스크린샷은 최대 3장까지만 등록 가능합니다.", "error");
                    return;
                }

                try {
                    setIsUploading(true);
                    const processedList = await Promise.all(
                        files.map(f => processImageFile(f, 600, 0.6))
                    );
                    setUploadedScreenshots(prev => [...prev, ...processedList]);
                    showToast(`${processedList.length}장의 스크린샷이 압축 등록되었습니다.`);
                } catch (err) {
                    showToast(err.message || "스크린샷 업로드 실패", "error");
                } finally {
                    setIsUploading(false);
                }
            };

            const removeScreenshot = (index) => {
                setUploadedScreenshots(prev => prev.filter((_, i) => i !== index));
            };

            // 웹앱 신규 등록 신청 (Firestore 저장)
            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                if (!currentUser.uid) {
                    showToast("웹앱을 등록하려면 먼저 로그인해 주세요.", "error");
                    handleGoogleLogin();
                    return;
                }

                const form = e.target;

                if (!uploadedIcon) {
                    showToast("앱 아이콘 이미지를 첨부해 주세요.", "error");
                    return;
                }

                const newAppData = {
                    name: form.name.value.trim(),
                    url: form.url.value.trim(),
                    shortDescription: form.shortDescription.value.trim(),
                    description: form.description.value.trim(),
                    category: form.category.value,
                    developer: form.developer.value.trim(),
                    iconUrl: uploadedIcon,
                    screenshots: uploadedScreenshots.length > 0 ? uploadedScreenshots : [uploadedIcon],
                    developerId: currentUser.uid,
                    status: 'pending',
                    createdAt: new Date().toISOString().split('T')[0],
                    rejectionReason: ''
                };

                if (window.FB_MODULE && window.FB_MODULE.db) {
                    try {
                        setIsUploading(true);
                        const { db, collection, addDoc } = window.FB_MODULE;
                        const appsRef = collection(db, 'apps');
                        await addDoc(appsRef, newAppData);
                        showToast("웹앱 등록 신청이 완료되었습니다. 관리자 검수 후 공개됩니다.");
                    } catch (err) {
                        console.error("Firestore 등록 에러:", err);
                        showToast("등록 실패: 네트워크 상태를 확인하세요.", "error");
                    } finally {
                        setIsUploading(false);
                    }
                } else {
                    const localDoc = { ...newAppData, id: 'local-' + Date.now() };
                    setApps(prev => [localDoc, ...prev]);
                    showToast("웹앱 등록 신청이 완료되었습니다 (로컬 저장).");
                }

                setIsRegisterOpen(false);
                setUploadedIcon(null);
                setUploadedScreenshots([]);
            };

            // 검수 상태 변경 (승인 / 거절)
            const handleUpdateStatus = async (targetAppId, newStatus, reason = '') => {
                if (currentUser.role !== 'admin') {
                    showToast("관리자 권한이 필요합니다.", "error");
                    return;
                }

                if (window.FB_MODULE && window.FB_MODULE.db) {
                    try {
                        const { db, doc, updateDoc } = window.FB_MODULE;
                        const appDocRef = doc(db, 'apps', targetAppId);
                        await updateDoc(appDocRef, {
                            status: newStatus,
                            rejectionReason: reason,
                            updatedAt: new Date().toISOString()
                        });
                        showToast(newStatus === 'approved' ? "웹앱이 승인되었습니다." : "신청이 거절 처리되었습니다.");
                    } catch (err) {
                        console.error("상태 업데이트 실패:", err);
                        setApps(prev => prev.map(a => a.id === targetAppId ? { ...a, status: newStatus, rejectionReason: reason } : a));
                        showToast("상태가 변경되었습니다.");
                    }
                } else {
                    setApps(prev => prev.map(a => a.id === targetAppId ? { ...a, status: newStatus, rejectionReason: reason } : a));
                    showToast("상태가 변경되었습니다.");
                }

                setRejectionModalApp(null);
                setRejectionReason('');
            };

            // 필터링된 데이터 목록
            const approvedApps = useMemo(() => {
                return apps.filter(app => {
                    const isApproved = app.status === 'approved';
                    const matchesCat = selectedCategory === '전체' || app.category === selectedCategory;
                    const matchesSearch = app.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          app.shortDescription.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          app.category.toLowerCase().includes(searchQuery.toLowerCase());
                    return isApproved && matchesCat && matchesSearch;
                });
            }, [apps, selectedCategory, searchQuery]);

            const myApps = useMemo(() => {
                if (!currentUser.uid) return [];
                return apps.filter(app => app.developerId === currentUser.uid);
            }, [apps, currentUser]);

            const pendingApps = useMemo(() => {
                return apps.filter(app => app.status === 'pending');
            }, [apps]);

            return (
                <div className="max-w-5xl mx-auto px-4 sm:px-6 py-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* 상단 헤더 */}
                    <header className="sticky top-0 z-30 clean-glass border-b border-neutral-200/80 -mx-4 px-4 sm:-mx-6 sm:px-6 py-3 mb-6">
                        <div className="flex items-center justify-between gap-4">
                            <div 
                                onClick={() => setActiveTab('home')} 
                                className="cursor-pointer font-bold text-lg tracking-tight text-neutral-900 flex items-center space-x-2"
                            >
                                <span className="w-2.5 h-2.5 rounded-full bg-neutral-900"></span>
                                <span>Web Square</span>
                            </div>

                            <div className="flex-1 max-w-xs relative hidden sm:block">
                                <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 text-xs"></i>
                                <input
                                    type="text"
                                    placeholder="웹앱 검색..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-8 pr-3 py-1.5 bg-neutral-100 border-none rounded-lg text-xs focus:ring-1 focus:ring-neutral-400 focus:bg-white transition-all outline-none"
                                />
                            </div>

                            <div className="flex items-center space-x-2">
                                {currentUser.uid ? (
                                    <div className="flex items-center space-x-1.5 px-2.5 py-1.5 bg-neutral-100 rounded-lg text-xs font-medium text-neutral-800">
                                        <i className="fas fa-user-circle text-neutral-500"></i>
                                        <span className="max-w-[100px] truncate">{currentUser.name || '사용자'}</span>
                                        {currentUser.role === 'admin' && (
                                            <span className="ml-1 px-1.5 py-0.2 bg-neutral-900 text-white text-[10px] rounded font-bold">
                                                ADMIN
                                            </span>
                                        )}
                                    </div>
                                ) : (
                                    <button
                                        onClick={handleGoogleLogin}
                                        className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-neutral-100 text-neutral-700 hover:bg-neutral-200 transition-colors flex items-center space-x-1"
                                    >
                                        <i className="fab fa-google text-xs text-rose-500"></i>
                                        <span>로그인</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => {
                                        if (!currentUser.uid) {
                                            showToast("앱 등록을 위해 먼저 로그인해 주세요.", "error");
                                            handleGoogleLogin();
                                            return;
                                        }
                                        setIsRegisterOpen(true);
                                    }}
                                    className="bg-neutral-900 hover:bg-neutral-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all"
                                >
                                    앱 등록 신청
                                </button>
                            </div>
                        </div>

                        <div className="mt-2.5 sm:hidden">
                            <div className="relative w-full">
                                <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 text-xs"></i>
                                <input
                                    type="text"
                                    placeholder="웹앱 검색..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-8 pr-3 py-1.5 bg-neutral-100 rounded-lg text-xs outline-none focus:bg-white"
                                />
                            </div>
                        </div>
                    </header>

                    {/* 메인 탭 뷰 */}
                    <div className="flex items-center justify-between border-b border-neutral-200 pb-2 mb-6">
                        <div className="flex space-x-1">
                            <button
                                onClick={() => setActiveTab('home')}
                                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                                    activeTab === 'home' ? 'bg-neutral-900 text-white' : 'text-neutral-600 hover:bg-neutral-100'
                                }`}
                            >
                                스토어
                            </button>

                            {currentUser.uid && (
                                <button
                                    onClick={() => setActiveTab('my_apps')}
                                    className={`flex items-center space-x-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                                        activeTab === 'my_apps' ? 'bg-neutral-900 text-white' : 'text-neutral-600 hover:bg-neutral-100'
                                    }`}
                                >
                                    <span>내 신청 목록</span>
                                    {myApps.length > 0 && (
                                        <span className="px-1.5 py-0.2 bg-neutral-200 text-neutral-800 text-[10px] rounded-full">
                                            {myApps.length}
                                        </span>
                                    )}
                                </button>
                            )}

                            {currentUser.role === 'admin' && (
                                <button
                                    onClick={() => setActiveTab('admin')}
                                    className={`flex items-center space-x-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                                        activeTab === 'admin' ? 'bg-neutral-900 text-white' : 'text-neutral-600 hover:bg-neutral-100'
                                    }`}
                                >
                                    <span>검수 대시보드</span>
                                    {pendingApps.length > 0 && (
                                        <span className="px-1.5 py-0.2 bg-rose-500 text-white text-[10px] rounded-full font-bold animate-pulse">
                                            {pendingApps.length}
                                        </span>
                                    )}
                                </button>
                            )}
                        </div>
                    </div>

                    {/* 1. 메인 스토어 탭 */}
                    {activeTab === 'home' && (
                        <main className="space-y-6">
                            <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-1">
                                {CATEGORIES.map((cat) => (
                                    <button
                                        key={cat}
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-3 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all ${
                                            selectedCategory === cat
                                                ? 'bg-neutral-900 text-white'
                                                : 'bg-white border border-neutral-200/80 text-neutral-600 hover:border-neutral-300'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            {approvedApps.length === 0 ? (
                                <div className="bg-white rounded-2xl p-12 text-center border border-neutral-200/80">
                                    <p className="text-neutral-500 text-xs mb-2">승인된 웹앱이 없습니다.</p>
                                    {(selectedCategory !== '전체' || searchQuery) && (
                                        <button
                                            onClick={() => { setSelectedCategory('전체'); setSearchQuery(''); }}
                                            className="px-3 py-1 bg-neutral-100 hover:bg-neutral-200 text-neutral-700 text-xs rounded-lg font-medium transition-colors"
                                        >
                                            검색 초기화
                                        </button>
                                    )}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {approvedApps.map((app) => (
                                        <div
                                            key={app.id}
                                            onClick={() => setSelectedApp(app)}
                                            className="bg-white border border-neutral-200/80 rounded-2xl p-4 cursor-pointer hover:border-neutral-400 transition-all flex flex-col justify-between space-y-3 group shadow-xs"
                                        >
                                            <div className="space-y-3">
                                                <div className="flex items-start space-x-3">
                                                    <img
                                                        src={app.iconUrl}
                                                        alt={app.name}
                                                        className="w-12 h-12 rounded-xl object-cover bg-neutral-100 border border-neutral-100 flex-shrink-0"
                                                        onError={(e) => { e.target.src = 'https://via.placeholder.com/150?text=App'; }}
                                                    />
                                                    <div className="min-w-0 flex-1">
                                                        <div className="flex items-center justify-between">
                                                            <h3 className="font-bold text-neutral-900 text-sm truncate group-hover:text-neutral-600 transition-colors">
                                                                {app.name}
                                                            </h3>
                                                            <span className="text-[10px] text-neutral-400 bg-neutral-100 px-1.5 py-0.5 rounded">
                                                                {app.category}
                                                            </span>
                                                        </div>
                                                        <p className="text-[11px] text-neutral-400 truncate mt-0.5">{app.developer}</p>
                                                    </div>
                                                </div>

                                                <p className="text-neutral-600 text-xs line-clamp-2 leading-relaxed">
                                                    {app.shortDescription}
                                                </p>

                                                {app.screenshots && app.screenshots[0] && (
                                                    <div className="h-32 rounded-xl bg-neutral-100 overflow-hidden border border-neutral-100">
                                                        <img
                                                            src={app.screenshots[0]}
                                                            alt={app.name}
                                                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                            onError={(e) => { e.target.style.display = 'none'; }}
                                                        />
                                                    </div>
                                                )}
                                            </div>

                                            <div className="pt-2 flex items-center justify-between border-t border-neutral-100 text-xs font-semibold">
                                                <span className="text-neutral-400 text-[11px] font-normal">PWA Web</span>
                                                <a
                                                    href={app.url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    onClick={(e) => e.stopPropagation()}
                                                    className="px-3 py-1 bg-neutral-900 hover:bg-neutral-800 text-white rounded-lg text-xs transition-colors"
                                                >
                                                    실행하기
                                                </a>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    )}

                    {/* 2. 내 신청 목록 탭 */}
                    {activeTab === 'my_apps' && (
                        <main className="space-y-4">
                            <h2 className="text-sm font-bold text-neutral-900">내 웹앱 신청 내역</h2>

                            {myApps.length === 0 ? (
                                <div className="bg-white rounded-2xl p-12 text-center border border-neutral-200">
                                    <p className="text-neutral-400 text-xs mb-3">등록 요청 내역이 없습니다.</p>
                                    <button
                                        onClick={() => setIsRegisterOpen(true)}
                                        className="px-3.5 py-1.5 bg-neutral-900 text-white text-xs font-semibold rounded-lg"
                                    >
                                        웹앱 등록 신청하기
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-2.5">
                                    {myApps.map((app) => (
                                        <div key={app.id} className="bg-white border border-neutral-200/80 rounded-xl p-4 flex items-center justify-between gap-4">
                                            <div className="flex items-center space-x-3 min-w-0">
                                                <img
                                                    src={app.iconUrl}
                                                    className="w-10 h-10 rounded-lg object-cover border border-neutral-100 flex-shrink-0"
                                                    onError={(e) => { e.target.src = 'https://via.placeholder.com/100?text=App'; }}
                                                />
                                                <div className="min-w-0">
                                                    <div className="flex items-center space-x-2">
                                                        <h3 className="font-bold text-xs text-neutral-900 truncate">{app.name}</h3>
                                                        <span className="text-[10px] text-neutral-400 bg-neutral-100 px-1.5 py-0.5 rounded">
                                                            {app.category}
                                                        </span>
                                                    </div>
                                                    <p className="text-[11px] text-neutral-500 truncate mt-0.5">{app.shortDescription}</p>
                                                </div>
                                            </div>

                                            <div className="flex items-center space-x-3">
                                                {app.status === 'pending' && (
                                                    <span className="text-[11px] font-semibold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200/60">
                                                        검토 중
                                                    </span>
                                                )}
                                                {app.status === 'approved' && (
                                                    <span className="text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200/60">
                                                        승인됨
                                                    </span>
                                                )}
                                                {app.status === 'rejected' && (
                                                    <div className="text-right">
                                                        <span className="text-[11px] font-semibold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-md border border-rose-200/60 block">
                                                            거절됨
                                                        </span>
                                                        {app.rejectionReason && (
                                                            <span className="text-[10px] text-rose-500 block mt-0.5 max-w-xs truncate">
                                                                {app.rejectionReason}
                                                            </span>
                                                        )}
                                                    </div>
                                                )}

                                                <button
                                                    onClick={() => setSelectedApp(app)}
                                                    className="px-2.5 py-1 text-xs border border-neutral-200 text-neutral-600 rounded-lg hover:bg-neutral-50"
                                                >
                                                    상세
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    )}

                    {/* 3. 검수 대시보드 (관리자 전용) */}
                    {activeTab === 'admin' && currentUser.role === 'admin' && (
                        <main className="space-y-4">
                            <div className="flex items-center justify-between">
                                <h2 className="text-sm font-bold text-neutral-900">검수 대기중인 신청 목록</h2>
                                <span className="text-xs bg-rose-100 text-rose-700 font-semibold px-2 py-0.5 rounded">
                                    {pendingApps.length}건
                                </span>
                            </div>

                            {pendingApps.length === 0 ? (
                                <div className="bg-white rounded-2xl p-12 text-center border border-neutral-200">
                                    <p className="text-neutral-400 text-xs">대기 중인 검수 요청이 없습니다.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {pendingApps.map((app) => (
                                        <div key={app.id} className="bg-white border border-neutral-200/80 rounded-xl p-4 space-y-3">
                                            <div className="flex items-start justify-between gap-4">
                                                <div className="flex items-start space-x-3">
                                                    <img
                                                        src={app.iconUrl}
                                                        className="w-12 h-12 rounded-xl object-cover border border-neutral-100 flex-shrink-0"
                                                    />
                                                    <div>
                                                        <h3 className="font-bold text-sm text-neutral-900">{app.name}</h3>
                                                        <p className="text-xs text-neutral-500 mt-0.5">{app.shortDescription}</p>
                                                        <p className="text-[10px] text-neutral-400 mt-1">
                                                            개발자: {app.developer} • 신청일: {app.createdAt}
                                                        </p>
                                                    </div>
                                                </div>

                                                <a
                                                    href={app.url}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="px-2.5 py-1 bg-neutral-100 hover:bg-neutral-200 text-neutral-800 text-xs font-semibold rounded-md flex items-center space-x-1"
                                                >
                                                    <span>사이트 이동</span>
                                                    <i className="fas fa-external-link-alt text-[9px]"></i>
                                                </a>
                                            </div>

                                            {app.screenshots && app.screenshots.length > 0 && (
                                                <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                                                    {app.screenshots.map((img, idx) => (
                                                        <img key={idx} src={img} className="h-24 rounded-lg object-cover border border-neutral-200" />
                                                    ))}
                                                </div>
                                            )}

                                            <div className="flex items-center justify-end space-x-2 pt-2 border-t border-neutral-100">
                                                <button
                                                    onClick={() => setRejectionModalApp(app)}
                                                    className="px-3 py-1 text-xs border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-50"
                                                >
                                                    거절
                                                </button>
                                                <button
                                                    onClick={() => handleUpdateStatus(app.id, 'approved')}
                                                    className="px-4 py-1 text-xs bg-neutral-900 text-white font-semibold rounded-lg hover:bg-neutral-800"
                                                >
                                                    승인 및 공개
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    )}

                    {/* 앱 상세 모달 */}
                    {selectedApp && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative border border-neutral-100 space-y-4 max-h-[90vh] overflow-y-auto">
                                <button
                                    onClick={() => setSelectedApp(null)}
                                    className="absolute top-4 right-4 w-7 h-7 bg-neutral-100 hover:bg-neutral-200 text-neutral-500 rounded-full flex items-center justify-center"
                                >
                                    <i className="fas fa-times text-xs"></i>
                                </button>

                                <div className="flex items-start space-x-3.5">
                                    <img
                                        src={selectedApp.iconUrl}
                                        alt={selectedApp.name}
                                        className="w-14 h-14 rounded-2xl object-cover border border-neutral-100"
                                    />
                                    <div>
                                        <span className="text-[10px] text-neutral-400 bg-neutral-100 px-1.5 py-0.5 rounded">
                                            {selectedApp.category}
                                        </span>
                                        <h2 className="text-lg font-bold text-neutral-900 mt-1">{selectedApp.name}</h2>
                                        <p className="text-xs text-neutral-400">개발자: {selectedApp.developer}</p>
                                    </div>
                                </div>

                                {selectedApp.screenshots && selectedApp.screenshots.length > 0 && (
                                    <div className="space-y-1.5">
                                        <p className="text-xs font-semibold text-neutral-700">스크린샷 미리보기</p>
                                        <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                                            {selectedApp.screenshots.map((s, idx) => (
                                                <img
                                                    key={idx}
                                                    src={s}
                                                    className="h-44 object-cover rounded-xl border border-neutral-200 flex-shrink-0"
                                                />
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-2 text-xs">
                                    <p className="font-semibold text-neutral-900">앱 설명</p>
                                    <p className="text-neutral-600 whitespace-pre-line leading-relaxed">
                                        {selectedApp.description || selectedApp.shortDescription}
                                    </p>
                                </div>

                                <div className="pt-2">
                                    <a
                                        href={selectedApp.url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="w-full py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-xl text-xs flex items-center justify-center space-x-1.5"
                                    >
                                        <span>웹앱 바로가기</span>
                                        <i className="fas fa-arrow-up-right-from-square text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 웹앱 등록 신청 모달 */}
                    {isRegisterOpen && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative my-8 border border-neutral-100">
                                <button
                                    onClick={() => {
                                        setIsRegisterOpen(false);
                                        setUploadedIcon(null);
                                        setUploadedScreenshots([]);
                                    }}
                                    className="absolute top-4 right-4 w-7 h-7 bg-neutral-100 hover:bg-neutral-200 text-neutral-500 rounded-full flex items-center justify-center"
                                >
                                    <i className="fas fa-times text-xs"></i>
                                </button>

                                <div className="mb-4">
                                    <h2 className="text-base font-bold text-neutral-900">웹앱 등록 신청</h2>
                                    <p className="text-xs text-neutral-400 mt-0.5">이미지는 초고율 압축 처리되어 Firestore에 안전하게 보관됩니다.</p>
                                </div>

                                <form onSubmit={handleRegisterSubmit} className="space-y-3.5 text-xs">
                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">웹앱 이름 *</label>
                                        <input required name="name" type="text" placeholder="예: 메모RE" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white focus:border-neutral-400" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">웹앱 URL *</label>
                                            <input required name="url" type="url" placeholder="https://..." className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">카테고리 *</label>
                                            <select name="category" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white">
                                                {CATEGORIES.filter(c => c !== '전체').map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">개발자 / 팀명 *</label>
                                        <input required name="developer" type="text" placeholder="예: 코드스튜디오" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white" />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">한 줄 소개 *</label>
                                        <input required name="shortDescription" type="text" placeholder="핵심 기능 요약" className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white" />
                                    </div>

                                    <div>
                                        <label className="block font-semibold text-neutral-700 mb-1">상세 설명</label>
                                        <textarea name="description" rows="2" placeholder="앱의 상세한 정보 작성..." className="w-full px-3 py-2 bg-neutral-50 border border-neutral-200 rounded-xl outline-none focus:bg-white"></textarea>
                                    </div>

                                    {/* 파일 이미지 직접 선택 및 실시간 압축 */}
                                    <div className="border-t border-neutral-100 pt-3 space-y-3">
                                        <p className="font-bold text-neutral-900 text-xs">이미지 등록 (자동 리사이징 & 압축)</p>

                                        {/* 앱 아이콘 */}
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">앱 아이콘 * (최대 180px 압축)</label>
                                            <div className="flex items-center space-x-3">
                                                <label className="cursor-pointer bg-neutral-100 hover:bg-neutral-200 border border-neutral-200 text-neutral-700 px-3 py-1.5 rounded-xl text-xs font-semibold inline-flex items-center space-x-1.5 transition-colors">
                                                    <i className="fas fa-image"></i>
                                                    <span>아이콘 선택</span>
                                                    <input type="file" accept="image/*" onChange={handleIconFileChange} className="hidden" />
                                                </label>
                                                {uploadedIcon && (
                                                    <img src={uploadedIcon} className="w-10 h-10 rounded-xl object-cover border border-neutral-200" />
                                                )}
                                            </div>
                                        </div>

                                        {/* 스크린샷 선택 */}
                                        <div>
                                            <label className="block font-semibold text-neutral-700 mb-1">스크린샷 (최대 3장, 600px 압축)</label>
                                            <label className="cursor-pointer bg-neutral-100 hover:bg-neutral-200 border border-neutral-200 text-neutral-700 px-3 py-1.5 rounded-xl text-xs font-semibold inline-flex items-center space-x-1.5 transition-colors">
                                                <i className="fas fa-images"></i>
                                                <span>갤러리에서 추가</span>
                                                <input type="file" accept="image/*" multiple onChange={handleScreenshotsFileChange} className="hidden" />
                                            </label>

                                            {uploadedScreenshots.length > 0 && (
                                                <div className="flex space-x-2 overflow-x-auto no-scrollbar mt-2 py-1">
                                                    {uploadedScreenshots.map((src, i) => (
                                                        <div key={i} className="relative group flex-shrink-0">
                                                            <img src={src} className="h-20 w-16 object-cover rounded-lg border border-neutral-200" />
                                                            <button
                                                                type="button"
                                                                onClick={() => removeScreenshot(i)}
                                                                className="absolute top-1 right-1 bg-neutral-900/80 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]"
                                                            >
                                                                <i className="fas fa-times"></i>
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setIsRegisterOpen(false);
                                                setUploadedIcon(null);
                                                setUploadedScreenshots([]);
                                            }}
                                            className="px-3 py-1.5 border border-neutral-200 text-neutral-600 rounded-xl hover:bg-neutral-50"
                                        >
                                            취소
                                        </button>
                                        <button
                                            type="submit"
                                            disabled={isUploading}
                                            className="px-4 py-1.5 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-xl"
                                        >
                                            {isUploading ? '압축 및 처리 중...' : '신청하기'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 거절 사유 작성 모달 */}
                    {rejectionModalApp && (
                        <div className="fixed inset-0 z-50 bg-neutral-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl border border-neutral-100 space-y-3">
                                <h3 className="text-xs font-bold text-neutral-900">거절 사유 입력</h3>
                                <textarea
                                    rows="3"
                                    value={rejectionReason}
                                    onChange={(e) => setRejectionReason(e.target.value)}
                                    placeholder="거절 사유를 작성하세요..."
                                    className="w-full p-2 bg-neutral-50 border border-neutral-200 rounded-lg text-xs outline-none focus:bg-white"
                                ></textarea>

                                <div className="flex justify-end space-x-2 pt-1">
                                    <button
                                        onClick={() => setRejectionModalApp(null)}
                                        className="px-2.5 py-1 border border-neutral-200 text-neutral-600 text-xs rounded-lg"
                                    >
                                        취소
                                    </button>
                                    <button
                                        onClick={() => handleUpdateStatus(rejectionModalApp.id, 'rejected', rejectionReason || '요청 미달')}
                                        className="px-3 py-1 bg-rose-600 text-white text-xs font-semibold rounded-lg"
                                    >
                                        거절 처리
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
